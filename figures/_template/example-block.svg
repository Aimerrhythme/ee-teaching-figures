<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="sans-serif, 'Noto Sans CJK SC', 'Microsoft YaHei'">
  <title>示例：单闭环控制框图（占位模板）</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#fff"/>
  <!-- 参考输入 -->
  <text x="40" y="125" font-size="18" fill="#222">r(t)</text>
  <line x1="80" y1="120" x2="150" y2="120" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 比较点 -->
  <circle cx="170" cy="120" r="18" fill="none" stroke="#222" stroke-width="2"/>
  <text x="140" y="108" font-size="16" fill="#222">+</text>
  <text x="176" y="160" font-size="16" fill="#222">−</text>
  <line x1="188" y1="120" x2="270" y2="120" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="110" font-size="16" fill="#222">e</text>
  <!-- 控制器 -->
  <rect x="270" y="90" width="140" height="60" fill="none" stroke="#1f6feb" stroke-width="2"/>
  <text x="340" y="126" font-size="18" fill="#1f6feb" text-anchor="middle">控制器 C(s)</text>
  <line x1="410" y1="120" x2="480" y2="120" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="110" font-size="16" fill="#222">u</text>
  <!-- 被控对象 -->
  <rect x="480" y="90" width="140" height="60" fill="none" stroke="#222" stroke-width="2"/>
  <text x="550" y="126" font-size="18" fill="#222" text-anchor="middle">对象 G(s)</text>
  <line x1="620" y1="120" x2="740" y2="120" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="745" y="125" font-size="18" fill="#222">y(t)</text>
  <!-- 反馈 -->
  <polyline points="680,120 680,230 170,230 170,138" fill="none" stroke="#d1242f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="425" y="255" font-size="16" fill="#d1242f" text-anchor="middle">反馈 H(s)=1</text>
  <text x="790" y="290" font-size="11" fill="#888" text-anchor="end">ee-teaching-figures · 模板示例 · MIT，可用于教学</text>
</svg>
