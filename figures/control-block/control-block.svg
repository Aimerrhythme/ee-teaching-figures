<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <title>单闭环负反馈控制框图</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#fff"/>
  <g font-family="sans-serif, 'Noto Sans CJK SC', 'Microsoft YaHei'" fill="#222">
    <text x="400" y="36" font-size="22" text-anchor="middle" font-weight="bold">单闭环负反馈控制系统框图</text>

    <!-- input -->
    <text x="30" y="172" font-size="16">R(s)</text>
    <text x="30" y="200" font-size="12" fill="#555">给定</text>
    <line x1="70" y1="180" x2="150" y2="180" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>

    <!-- comparator -->
    <circle cx="170" cy="180" r="18" fill="none" stroke="#222" stroke-width="2"/>
    <line x1="157" y1="167" x2="183" y2="193" stroke="#222" stroke-width="2"/>
    <line x1="183" y1="167" x2="157" y2="193" stroke="#222" stroke-width="2"/>
    <text x="138" y="170" font-size="18">+</text>
    <text x="178" y="222" font-size="22" fill="#d1242f" font-weight="bold">−</text>
    <text x="170" y="138" font-size="12" text-anchor="middle" fill="#555">比较环节</text>

    <line x1="188" y1="180" x2="258" y2="180" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
    <text x="210" y="170" font-size="16">E(s)</text>
    <text x="210" y="200" font-size="12" fill="#555">偏差</text>

    <!-- controller -->
    <rect x="260" y="150" width="120" height="60" fill="none" stroke="#222" stroke-width="2"/>
    <text x="320" y="176" font-size="15" text-anchor="middle">控制器</text>
    <text x="320" y="198" font-size="16" text-anchor="middle">Gc(s)</text>

    <line x1="380" y1="180" x2="454" y2="180" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
    <text x="396" y="170" font-size="16">U(s)</text>
    <text x="396" y="200" font-size="12" fill="#555">控制量</text>

    <!-- disturbance summing -->
    <circle cx="470" cy="180" r="14" fill="none" stroke="#222" stroke-width="2"/>
    <text x="470" y="186" font-size="16" text-anchor="middle">+</text>
    <line x1="470" y1="90" x2="470" y2="164" stroke="#222" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
    <text x="482" y="98" font-size="16">D(s)</text>
    <text x="482" y="118" font-size="12" fill="#555">扰动（可选）</text>

    <line x1="484" y1="180" x2="538" y2="180" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>

    <!-- plant -->
    <rect x="540" y="150" width="120" height="60" fill="none" stroke="#222" stroke-width="2"/>
    <text x="600" y="176" font-size="15" text-anchor="middle">被控对象</text>
    <text x="600" y="198" font-size="16" text-anchor="middle">Gp(s)</text>

    <!-- output -->
    <line x1="660" y1="180" x2="768" y2="180" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
    <circle cx="710" cy="180" r="4" fill="#222"/>
    <text x="728" y="170" font-size="16">Y(s)</text>
    <text x="728" y="200" font-size="12" fill="#555">输出</text>

    <!-- feedback path -->
    <polyline points="710,180 710,330 502,330" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#arb)"/>
    <rect x="380" y="300" width="120" height="60" fill="none" stroke="#1f6feb" stroke-width="2"/>
    <text x="440" y="326" font-size="15" text-anchor="middle" fill="#1f6feb">检测/反馈</text>
    <text x="440" y="348" font-size="16" text-anchor="middle" fill="#1f6feb">H(s)</text>
    <polyline points="380,330 170,330 170,200" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#arb)"/>
    <text x="250" y="320" font-size="16" fill="#1f6feb">B(s)</text>
    <text x="250" y="350" font-size="12" fill="#1f6feb">反馈信号</text>
    <text x="600" y="320" font-size="12" fill="#1f6feb" text-anchor="middle">反馈通道</text>
    <text x="320" y="240" font-size="12" fill="#555" text-anchor="middle">前向通道 →</text>

    <!-- formulas -->
    <text x="400" y="400" font-size="15" text-anchor="middle">E(s) = R(s) − H(s)·Y(s)　　闭环传递函数（D=0）：Φ(s) = Y(s)/R(s) = Gc·Gp / (1 + Gc·Gp·H)</text>
    <text x="400" y="428" font-size="12" text-anchor="middle" fill="#555">本图自绘 · ee-teaching-figures · 可用于教学，注明出处</text>
  </g>
</svg>
