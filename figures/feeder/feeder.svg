<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif, 'Noto Sans CJK SC', 'Microsoft YaHei'" font-size="14">
  <title>10 kV 辐射式馈线单线图</title>
  <desc>自绘教学示意图。变电站 10 kV 母线经出线断路器引出一条辐射式馈线，主干线设分段开关，分支经熔断器接配电变压器和负荷，末端经常开联络开关与相邻馈线相连。非教材或手册插图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" fill="#222222">10 kV 辐射式馈线单线图</text>
  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#555555">单电源供电；正常运行时联络开关断开，故障时可分段隔离并转供</text>

  <g stroke="#222222" stroke-width="2" fill="none">
    <!-- 系统电源与主变 -->
    <circle cx="50" cy="200" r="16"/>
    <path d="M40,200 q5,-8 10,0 t10,0"/>
    <line x1="66" y1="200" x2="88" y2="200"/>
    <circle cx="102" cy="200" r="14"/>
    <circle cx="122" cy="200" r="14"/>
    <line x1="136" y1="200" x2="172" y2="200"/>
  </g>
  <text x="50" y="174" text-anchor="middle" font-size="12" fill="#222222">110 kV 系统</text>
  <text x="112" y="174" text-anchor="middle" font-size="12" fill="#222222">主变</text>
  <text x="112" y="232" text-anchor="middle" font-size="12" fill="#222222">110/10 kV</text>

  <!-- 10 kV 母线 -->
  <line x1="172" y1="100" x2="172" y2="250" stroke="#222222" stroke-width="6"/>
  <text x="172" y="90" text-anchor="middle" font-size="13" fill="#222222">10 kV 母线</text>

  <!-- 其他出线 -->
  <line x1="172" y1="130" x2="200" y2="130" stroke="#222222" stroke-width="2"/>
  <rect x="200" y="120" width="20" height="20" fill="#222222"/>
  <line x1="220" y1="130" x2="260" y2="130" stroke="#222222" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="266" y="134" font-size="12" fill="#555555">QF2 · 其他出线</text>

  <!-- 本馈线主干 -->
  <g stroke="#222222" stroke-width="2">
    <line x1="172" y1="200" x2="200" y2="200"/>
    <line x1="220" y1="200" x2="363" y2="200"/>
    <line x1="377" y1="200" x2="503" y2="200"/>
    <line x1="517" y1="200" x2="652" y2="200"/>
  </g>
  <rect x="200" y="190" width="20" height="20" fill="#222222"/>
  <text x="210" y="182" text-anchor="middle" font-size="12" fill="#222222">QF1</text>
  <circle cx="370" cy="200" r="7" fill="#222222"/>
  <text x="370" y="186" text-anchor="middle" font-size="12" fill="#222222">S1</text>
  <circle cx="510" cy="200" r="7" fill="#222222"/>
  <text x="510" y="186" text-anchor="middle" font-size="12" fill="#222222">S2</text>
  <circle cx="660" cy="200" r="7" fill="#ffffff" stroke="#d1242f" stroke-width="2"/>
  <text x="660" y="226" text-anchor="middle" font-size="12" fill="#d1242f">联络开关 QS</text>
  <text x="660" y="242" text-anchor="middle" font-size="12" fill="#d1242f">（常开）</text>
  <line x1="668" y1="200" x2="770" y2="200" stroke="#555555" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="725" y="186" text-anchor="middle" font-size="12" fill="#555555">至相邻馈线</text>

  <!-- 潮流方向 -->
  <line x1="240" y1="160" x2="620" y2="160" stroke="#1f6feb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="430" y="152" text-anchor="middle" font-size="12" fill="#1f6feb">潮流方向（单向）</text>

  <!-- 分支 1 -->
  <circle cx="300" cy="200" r="4" fill="#222222"/>
  <g stroke="#222222" stroke-width="2" fill="none">
    <line x1="300" y1="200" x2="300" y2="236"/>
    <rect x="295" y="236" width="10" height="24" fill="#ffffff"/>
    <line x1="300" y1="236" x2="300" y2="260"/>
    <line x1="300" y1="260" x2="300" y2="282"/>
    <circle cx="300" cy="294" r="12"/>
    <circle cx="300" cy="312" r="12"/>
    <line x1="300" y1="324" x2="300" y2="350"/>
  </g>
  <line x1="300" y1="350" x2="300" y2="372" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="312" y="252" font-size="12" fill="#222222">FU1</text>
  <text x="318" y="307" font-size="12" fill="#222222">T1</text>
  <text x="300" y="390" text-anchor="middle" font-size="12" fill="#222222">负荷 L1</text>

  <!-- 分支 2 -->
  <circle cx="440" cy="200" r="4" fill="#222222"/>
  <g stroke="#222222" stroke-width="2" fill="none">
    <line x1="440" y1="200" x2="440" y2="236"/>
    <rect x="435" y="236" width="10" height="24" fill="#ffffff"/>
    <line x1="440" y1="236" x2="440" y2="260"/>
    <line x1="440" y1="260" x2="440" y2="282"/>
    <circle cx="440" cy="294" r="12"/>
    <circle cx="440" cy="312" r="12"/>
    <line x1="440" y1="324" x2="440" y2="350"/>
  </g>
  <line x1="440" y1="350" x2="440" y2="372" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="452" y="252" font-size="12" fill="#222222">FU2</text>
  <text x="458" y="307" font-size="12" fill="#222222">T2</text>
  <text x="440" y="390" text-anchor="middle" font-size="12" fill="#222222">负荷 L2</text>

  <!-- 分支 3 -->
  <circle cx="580" cy="200" r="4" fill="#222222"/>
  <g stroke="#222222" stroke-width="2" fill="none">
    <line x1="580" y1="200" x2="580" y2="236"/>
    <rect x="575" y="236" width="10" height="24" fill="#ffffff"/>
    <line x1="580" y1="236" x2="580" y2="260"/>
    <line x1="580" y1="260" x2="580" y2="282"/>
    <circle cx="580" cy="294" r="12"/>
    <circle cx="580" cy="312" r="12"/>
    <line x1="580" y1="324" x2="580" y2="350"/>
  </g>
  <line x1="580" y1="350" x2="580" y2="372" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="592" y="252" font-size="12" fill="#222222">FU3</text>
  <text x="598" y="307" font-size="12" fill="#222222">T3</text>
  <text x="580" y="390" text-anchor="middle" font-size="12" fill="#222222">负荷 L3</text>

  <!-- 图例 -->
  <line x1="20" y1="402" x2="780" y2="402" stroke="#cccccc" stroke-width="1"/>
  <g font-size="12" fill="#222222">
    <rect x="30" y="418" width="12" height="12" fill="#222222"/>
    <text x="48" y="429">断路器</text>
    <circle cx="136" cy="424" r="6" fill="#222222"/>
    <text x="148" y="429">分段开关（常闭）</text>
    <circle cx="276" cy="424" r="6" fill="#ffffff" stroke="#d1242f" stroke-width="2"/>
    <text x="288" y="429">联络开关（常开）</text>
    <rect x="412" y="414" width="8" height="20" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <line x1="416" y1="410" x2="416" y2="438" stroke="#222222" stroke-width="2"/>
    <text x="428" y="429">熔断器</text>
    <circle cx="506" cy="424" r="8" fill="none" stroke="#222222" stroke-width="2"/>
    <circle cx="518" cy="424" r="8" fill="none" stroke="#222222" stroke-width="2"/>
    <text x="532" y="429">配变 10/0.4 kV</text>
    <line x1="650" y1="424" x2="662" y2="424" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="672" y="429">负荷</text>
  </g>
</svg>
