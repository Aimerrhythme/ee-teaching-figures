<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif, 'Noto Sans CJK SC', 'Microsoft YaHei'" font-size="14">
  <title>单相变压器：结构示意与 T 型等效电路</title>
  <desc>自绘教学示意图。左为心式单相双绕组变压器结构，右为折算到一次侧的 T 型等效电路。非教材或手册插图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1242f"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" fill="#222222">单相变压器：结构示意与 T 型等效电路</text>
  <text x="200" y="52" text-anchor="middle" font-size="15" fill="#1f6feb">① 结构示意（心式）</text>
  <text x="600" y="52" text-anchor="middle" font-size="15" fill="#1f6feb">② T 型等效电路（折算到一次侧）</text>

  <!-- 铁心 -->
  <path fill="#f3f4f6" stroke="#222222" stroke-width="2" fill-rule="evenodd" d="M128,96 H328 V338 H128 Z M172,140 H284 V294 H172 Z"/>
  <text x="228" y="328" text-anchor="middle" font-size="13" fill="#222222" stroke="#f3f4f6" stroke-width="4" paint-order="stroke fill">铁心</text>

  <!-- 主磁通，避开线匝 -->
  <polyline points="168,118 292,118" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <polyline points="292,306 168,306" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <polyline points="150,154 150,130" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <polyline points="306,130 306,154" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>

  <!-- 一次绕组 N1 -->
  <g fill="none" stroke="#1f6feb" stroke-width="2">
    <ellipse cx="150" cy="168" rx="30" ry="8"/>
    <ellipse cx="150" cy="188" rx="30" ry="8"/>
    <ellipse cx="150" cy="208" rx="30" ry="8"/>
    <ellipse cx="150" cy="228" rx="30" ry="8"/>
    <ellipse cx="150" cy="248" rx="30" ry="8"/>
    <ellipse cx="150" cy="268" rx="30" ry="8"/>
  </g>
  <!-- 二次绕组 N2 -->
  <g fill="none" stroke="#d1242f" stroke-width="2">
    <ellipse cx="306" cy="168" rx="30" ry="8"/>
    <ellipse cx="306" cy="188" rx="30" ry="8"/>
    <ellipse cx="306" cy="208" rx="30" ry="8"/>
    <ellipse cx="306" cy="228" rx="30" ry="8"/>
    <ellipse cx="306" cy="248" rx="30" ry="8"/>
    <ellipse cx="306" cy="268" rx="30" ry="8"/>
  </g>
  <text x="150" y="290" text-anchor="middle" font-size="14" fill="#1f6feb">N₁</text>
  <text x="306" y="290" text-anchor="middle" font-size="14" fill="#d1242f">N₂</text>

  <text x="228" y="196" text-anchor="middle" font-size="13" fill="#222222">主磁通</text>
  <text x="228" y="218" text-anchor="middle" font-size="16" fill="#1f6feb">Φₘ</text>
  <text x="228" y="242" text-anchor="middle" font-size="13" fill="#222222">k = N₁/N₂</text>

  <!-- 一次端子：电流流入同名端 -->
  <polyline points="96,78 96,168 120,168" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="96,360 96,268 120,268" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="112" cy="156" r="4.5" fill="#222222"/>
  <line x1="110" y1="96" x2="110" y2="140" stroke="#1f6feb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="74" y="126" text-anchor="middle" font-size="14" fill="#1f6feb">I₁</text>
  <text x="96" y="68" text-anchor="middle" font-size="14" fill="#222222">U₁</text>
  <text x="80" y="82" text-anchor="middle" font-size="14" fill="#222222">+</text>
  <text x="80" y="368" text-anchor="middle" font-size="16" fill="#222222">−</text>

  <!-- 二次端子：电流流出同名端 -->
  <polyline points="362,78 362,168 336,168" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="362,360 362,268 336,268" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="344" cy="156" r="4.5" fill="#222222"/>
  <line x1="348" y1="140" x2="348" y2="96" stroke="#d1242f" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="372" y="122" font-size="14" fill="#d1242f">I₂</text>
  <text x="362" y="68" text-anchor="middle" font-size="14" fill="#222222">U₂</text>
  <text x="376" y="82" text-anchor="middle" font-size="14" fill="#222222">+</text>
  <text x="376" y="368" text-anchor="middle" font-size="16" fill="#222222">−</text>

  <text x="210" y="396" text-anchor="middle" font-size="12" fill="#444444">蓝 N₁ 一次，红 N₂ 二次；黑点为同名端</text>
  <text x="210" y="414" text-anchor="middle" font-size="12" fill="#444444">I₁ 流入同名端，I₂ 流出；线匝与 Φₘ 方向均为示意</text>

  <!-- T 型等效电路。水平干线 y=176，回流线 y=336 -->
  <line x1="430" y1="176" x2="430" y2="336" stroke="#222222" stroke-width="2"/>
  <line x1="430" y1="336" x2="762" y2="336" stroke="#222222" stroke-width="2"/>
  <text x="416" y="180" text-anchor="middle" font-size="14" fill="#222222">+</text>
  <text x="416" y="340" text-anchor="middle" font-size="16" fill="#222222">−</text>
  <text x="430" y="128" text-anchor="middle" font-size="14" fill="#222222">U₁</text>

  <line x1="430" y1="176" x2="452" y2="176" stroke="#222222" stroke-width="2"/>
  <rect x="452" y="162" width="46" height="28" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="475" y="181" text-anchor="middle" font-size="14" fill="#222222">R₁</text>
  <line x1="498" y1="176" x2="508" y2="176" stroke="#222222" stroke-width="2"/>
  <path d="M508,176 C512,162 520,162 524,176 C528,162 536,162 540,176 C544,162 552,162 556,176" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round"/>
  <text x="532" y="150" text-anchor="middle" font-size="13" fill="#222222">jX₁σ</text>
  <line x1="556" y1="176" x2="574" y2="176" stroke="#1f6feb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="574" y1="176" x2="584" y2="176" stroke="#222222" stroke-width="2"/>
  <text x="566" y="152" text-anchor="middle" font-size="12" fill="#1f6feb" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">I₁</text>

  <circle cx="584" cy="176" r="3.5" fill="#222222"/>
  <line x1="584" y1="176" x2="608" y2="176" stroke="#d1242f" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="608" y1="176" x2="632" y2="176" stroke="#222222" stroke-width="2"/>
  <text x="624" y="152" text-anchor="middle" font-size="12" fill="#d1242f" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">I′₂</text>
  <rect x="632" y="162" width="50" height="28" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="657" y="181" text-anchor="middle" font-size="14" fill="#222222">R′₂</text>
  <line x1="682" y1="176" x2="694" y2="176" stroke="#222222" stroke-width="2"/>
  <path d="M694,176 C698,162 706,162 710,176 C714,162 722,162 726,176 C730,162 738,162 742,176" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round"/>
  <text x="718" y="150" text-anchor="middle" font-size="13" fill="#222222">jX′₂σ</text>
  <line x1="742" y1="176" x2="762" y2="176" stroke="#222222" stroke-width="2"/>

  <!-- 励磁支路并联 -->
  <line x1="584" y1="180" x2="584" y2="198" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="584" y1="198" x2="584" y2="208" stroke="#222222" stroke-width="2"/>
  <text x="572" y="196" text-anchor="end" font-size="12" fill="#222222" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">I₀</text>
  <line x1="562" y1="208" x2="606" y2="208" stroke="#222222" stroke-width="2"/>
  <circle cx="584" cy="208" r="3.5" fill="#222222"/>

  <line x1="562" y1="208" x2="562" y2="224" stroke="#222222" stroke-width="2"/>
  <rect x="549" y="224" width="26" height="46" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="542" y="252" text-anchor="end" font-size="13" fill="#222222">Rₘ</text>
  <line x1="562" y1="270" x2="562" y2="296" stroke="#222222" stroke-width="2"/>

  <line x1="606" y1="208" x2="606" y2="224" stroke="#222222" stroke-width="2"/>
  <path d="M606,224 C620,228 620,236 606,240 C620,244 620,252 606,256 C620,260 620,268 606,272" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round"/>
  <text x="638" y="252" font-size="13" fill="#222222">jXₘ</text>
  <line x1="606" y1="272" x2="606" y2="296" stroke="#222222" stroke-width="2"/>

  <line x1="562" y1="296" x2="606" y2="296" stroke="#222222" stroke-width="2"/>
  <circle cx="584" cy="296" r="3.5" fill="#222222"/>
  <line x1="584" y1="296" x2="584" y2="336" stroke="#222222" stroke-width="2"/>
  <circle cx="584" cy="336" r="3.5" fill="#222222"/>
  <text x="596" y="322" font-size="13" fill="#1f6feb" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">E₁</text>

  <!-- 负载 -->
  <line x1="762" y1="176" x2="762" y2="220" stroke="#222222" stroke-width="2"/>
  <rect x="736" y="220" width="52" height="44" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="762" y="238" text-anchor="middle" font-size="13" fill="#222222">Z′<tspan font-size="10" baseline-shift="sub">L</tspan></text>
  <text x="762" y="254" text-anchor="middle" font-size="11" fill="#444444">负载</text>
  <line x1="762" y1="264" x2="762" y2="336" stroke="#222222" stroke-width="2"/>
  <circle cx="762" cy="176" r="3.5" fill="#222222"/>
  <circle cx="762" cy="336" r="3.5" fill="#222222"/>
  <text x="762" y="128" text-anchor="middle" font-size="14" fill="#222222">U′₂</text>
  <text x="778" y="172" font-size="14" fill="#222222">+</text>
  <text x="778" y="340" font-size="16" fill="#222222">−</text>

  <text x="600" y="360" text-anchor="middle" font-size="12" fill="#444444">励磁支路 Rₘ ∥ jXₘ 居中，故称 T 型；参数已折算到一次侧</text>
  <text x="600" y="380" text-anchor="middle" font-size="12" fill="#222222">k = N₁/N₂ ， R′₂ = k²R₂ ， X′₂σ = k²X₂σ</text>
  <text x="600" y="398" text-anchor="middle" font-size="12" fill="#222222">U′₂ = kU₂ ， I′₂ = I₂/k</text>
  <text x="600" y="416" text-anchor="middle" font-size="12" fill="#222222">I₁ = I₀ + I′₂ ， I₀ = I<tspan font-size="9" baseline-shift="sub">Fe</tspan> + I<tspan font-size="9" baseline-shift="sub">μ</tspan> ， E₁ 为励磁支路电压</text>

  <text x="790" y="442" text-anchor="end" font-size="11" fill="#888888">ee-teaching-figures · 自绘 · MIT，可用于教学</text>
</svg>
